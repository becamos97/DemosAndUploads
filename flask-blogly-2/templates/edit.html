<!DOCTYPE html>
<html>
<head>
  <title>Edit {{ user.full_name() }}</title>
</head>
<body>
  <h1>Edit {{ user.full_name() }}</h1>

  <form method="POST">
    <p>First Name: <input type="text" name="first_name" value="{{ user.first_name }}"></p>
    <p>Last Name: <input type="text" name="last_name" value="{{ user.last_name }}"></p>
    <p>Image URL: <input type="text" name="image_url" value="{{ user.image_url }}"></p>
    <button>Save</button>
    <a href="/users/{{ user.id }}">Cancel</a>
  </form>
</body>
</html>
