<!DOCTYPE html>
<html>
<head>
  <title>Edit Post</title>
</head>
<body>
  <h1>Edit Post</h1>

  <form method="POST">
    <p>Title:
      <input type="text" name="title" value="{{ post.title }}">
    </p>
    <p>Content:
      <textarea name="content">{{ post.content }}</textarea>
    </p>
    <button>Save</button>
    <a href="/posts/{{ post.id }}">Cancel</a>
  </form>
</body>
</html>
