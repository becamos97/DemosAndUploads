<!DOCTYPE html>
<html>
<head>
  <title>{{ post.title }}</title>
</head>
<body>
  <h1>{{ post.title }}</h1>
  <p><strong>By:</strong> {{ post.user.full_name() }}</p>
  <p><em>Posted on {{ post.created_at.strftime('%B %d, %Y at %I:%M%p') }}</em></p>
  <p>{{ post.content }}</p>

  <p>
    <a href="/posts/{{ post.id }}/edit">Edit</a>
    |
    <form action="/posts/{{ post.id }}/delete" method="POST" style="display:inline;">
      <button>Delete</button>
    </form>
  </p>

  <a href="/users/{{ post.user_id }}">Back to {{ post.user.full_name() }}</a>
</body>
</html>
