{% extends 'base.html' %}

{% block title %}Tag: {{ tag.name }}{% endblock %}

{% block content %}
<h1>{{ tag.name }}</h1>

<h3>Posts with this Tag:</h3>
<ul>
  {% for post in tag.posts %}
    <li><a href="/posts/{{ post.id }}">{{ post.title }}</a></li>
  {% else %}
    <li>No posts tagged yet.</li>
  {% endfor %}
</ul>

<a href="/tags/{{ tag.id }}/edit" class="btn btn-warning">Edit</a>
<form method="POST" action="/tags/{{ tag.id }}/delete" class="d-inline">
  <button class="btn btn-danger">Delete</button>
</form>
<a href="/tags" class="btn btn-secondary">Back</a>
{% endblock %}
