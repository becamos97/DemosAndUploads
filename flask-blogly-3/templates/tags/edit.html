{% extends 'base.html' %}

{% block title %}Edit Tag{% endblock %}

{% block content %}
<h1>Edit Tag</h1>

<form method="POST">
  <div class="form-group">
    <label for="name">Tag Name:</label>
    <input name="name" class="form-control" value="{{ tag.name }}" required>
  </div>

  <button class="btn btn-primary">Save</button>
</form>

<a href="/tags" class="btn btn-secondary mt-3">Cancel</a>
{% endblock %}
