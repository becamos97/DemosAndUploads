{% extends 'base.html' %}

{% block title %}All Tags{% endblock %}

{% block content %}
<h1>All Tags</h1>
<ul>
  {% for tag in tags %}
    <li><a href="/tags/{{ tag.id }}">{{ tag.name }}</a></li>
  {% endfor %}
</ul>

<a href="/users" class="btn btn-secondary mt-3">Back to Users</a>


<a href="/tags/new" class="btn btn-primary">Add Tag</a>
{% endblock %}
