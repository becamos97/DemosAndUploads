<!DOCTYPE html>
<html>
<head>
  <title>Edit Post</title>
</head>
<body>
  <h1>Edit Post</h1>

  <form method="POST">
    <p>Title: <input type="text" name="title" value="{{ post.title }}"></p>
    <p>Content: <textarea name="content">{{ post.content }}</textarea></p>

    <fieldset>
      <legend>Tags</legend>
      {% for tag in tags %}
        <label>
          <input type="checkbox" name="tags" value="{{ tag.id }}"
            {% if tag in post.tags %}checked{% endif %}>
          {{ tag.name }}
        </label><br>
      {% endfor %}
    </fieldset>

    <button>Save</button>
  </form>

  <a href="/users/{{ post.user_id }}">Cancel</a>
</body>
</html>
