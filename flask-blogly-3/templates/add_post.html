<!DOCTYPE html>
<html>
<head>
  <title>New Post</title>
</head>
<body>
  <h1>Add Post for {{ user.full_name() }}</h1>

  <form method="POST">
    <p>Title: <input type="text" name="title"></p>
    <p>Content: <textarea name="content"></textarea></p>


    <fieldset>
  <legend>Tags</legend>
  {% for tag in tags %}
    <label>
      <input type="checkbox" name="tags" value="{{ tag.id }}">
      {{ tag.name }}
    </label><br>
  {% endfor %}
</fieldset>

    <button>Add</button>
  </form>

  <a href="/users/{{ user.id }}">Cancel</a>
</body>
</html>
